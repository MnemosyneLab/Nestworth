[package]
name = "nestworth"
version = "0.1.1"
description = "A local-first household net worth tracker"
authors = ["Nestworth contributors"]
license = "MIT"
edition = "2021"
default-run = "nestworth"

[lib]
name = "nestworth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
export-bindings = []

[[bin]]
name = "export-bindings"
path = "bin/export-bindings.rs"
required-features = ["export-bindings"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rust_decimal = "1"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "function"] }
specta-typescript = "=0.0.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23.1"
