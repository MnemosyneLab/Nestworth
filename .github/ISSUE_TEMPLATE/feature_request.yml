name: Feature request
description: Suggest an improvement to Nestworth.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Please describe the workflow or user need without including private financial data or credentials.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts and net worth
        - Members and ownership
        - Institutions and groups
        - Appearance and media
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the workflow that is difficult or missing today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what you would like Nestworth to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or other designs you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe examples, screenshots, or related tools when useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I removed sensitive information from examples and screenshots.
          required: true
